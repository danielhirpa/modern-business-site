<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <nav class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-bold text-indigo-400">Daniel.dev</a>
            <div class="space-x-6 text-sm font-medium">
                <a href="{% url 'home' %}" class="hover:text-indigo-400 transition">Home</a>
                <a href="{% url 'about' %}" class="hover:text-indigo-400 transition">About</a>
                <a href="{% url 'projects' %}" class="hover:text-indigo-400 transition">Projects</a>
            </div>
        </nav>
    </header>

    <!-- Main Dynamic Content Area -->
    <main class="flex-grow max-w-5xl mx-auto px-6 py-10 w-full">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-6 text-sm text-slate-400">
        <p>&copy; 2026 Daniel Hirpa. Built with Django & Tailwind CSS.</p>
    </footer>

</body>
</html>
