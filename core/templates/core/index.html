<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Django App - Home</title>
</head>
<body>
    <h1>Welcome to My Django Blog!</h1>
    <a href="{% url 'about' %}">Go to About Page</a>

    <hr>

    <h2>Recent Posts from Database:</h2>
    
    <!-- Loop through each post passed from the view -->
    {% for post in posts %}
        <div>
            <h3>{{ post.title }}</h3>
            <p>{{ post.content }}</p>
            <small>Created at: {{ post.created_at }}</small>
        </div>
        <hr>
    {% empty %}
        <p>No posts available yet!</p>
    {% endfor %}
</body>
</html>
